name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # autohotkey.com is behind a Cloudflare check that blocks CI runners,
      # so AutoHotkey v2 and Ahk2Exe are installed from their GitHub releases.
      - name: Install AutoHotkey v2 and Ahk2Exe
        id: ahk
        uses: holy-tao/install-autohotkey@v2
        with:
          version: latest
          compiler: latest
          destination: ${{ runner.temp }}

      - name: Compile
        shell: pwsh
        env:
          AHK2EXE: ${{ steps.ahk.outputs.ahk2Exe }}
          AHK64: ${{ steps.ahk.outputs.ahk64 }}
          AHK32: ${{ steps.ahk.outputs.ahk32 }}
        run: |
          $script = Resolve-Path MicToggle.ahk
          $builds = @(
            @{ Base = $env:AHK64; Out = "MicToggle.exe" }
            @{ Base = $env:AHK32; Out = "MicToggle-x86.exe" }
          )
          foreach ($b in $builds) {
            $out = Join-Path $PWD $b.Out
            $p = Start-Process $env:AHK2EXE -ArgumentList "/in `"$script`" /out `"$out`" /base `"$($b.Base)`" /silent verbose" -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) {
              throw "Compilation of $($b.Out) failed (exit code $($p.ExitCode))"
            }
          }
          Get-FileHash MicToggle.exe, MicToggle-x86.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicToggle
          path: |
            MicToggle.exe
            MicToggle-x86.exe
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MicToggle.exe
            MicToggle-x86.exe
            SHA256SUMS.txt
          generate_release_notes: true
