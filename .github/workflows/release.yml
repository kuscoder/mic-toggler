name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        run: |
          # v2: интерпретатор, который станет основой exe
          Invoke-WebRequest https://www.autohotkey.com/download/ahk-v2.zip -OutFile ahk-v2.zip
          Expand-Archive ahk-v2.zip -DestinationPath ahk-v2
          # компилятор Ahk2Exe поставляется в архиве v1
          Invoke-WebRequest https://www.autohotkey.com/download/ahk.zip -OutFile ahk-v1.zip
          Expand-Archive ahk-v1.zip -DestinationPath ahk-v1

      - name: Compile
        shell: pwsh
        run: |
          $compiler = Resolve-Path ahk-v1\Compiler\Ahk2Exe.exe
          $script   = Resolve-Path MicToggle.ahk
          $builds = @(
            @{ Base = "ahk-v2\AutoHotkey64.exe"; Out = "MicToggle.exe" }
            @{ Base = "ahk-v2\AutoHotkey32.exe"; Out = "MicToggle-x86.exe" }
          )
          foreach ($b in $builds) {
            $base = Resolve-Path $b.Base
            $out  = Join-Path $PWD $b.Out
            $p = Start-Process $compiler -ArgumentList "/in `"$script`" /out `"$out`" /base `"$base`" /silent verbose" -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) {
              throw "Compilation of $($b.Out) failed (exit code $($p.ExitCode))"
            }
          }
          Get-FileHash MicToggle.exe, MicToggle-x86.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicToggle
          path: |
            MicToggle.exe
            MicToggle-x86.exe
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MicToggle.exe
            MicToggle-x86.exe
            SHA256SUMS.txt
          generate_release_notes: true
